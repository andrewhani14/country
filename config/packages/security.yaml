security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            memory:
                users:
                    admin:
                        password: '%env(ADMIN_PASSWORD)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            http_basic: ~
            provider: app_user_provider

    access_control:
        - { path: ^/api/v1/countries$, methods: [POST], roles: ROLE_ADMIN }
        - { path: ^/api/v1/countries/[^/]+$, methods: [PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api, roles: PUBLIC_ACCESS }
